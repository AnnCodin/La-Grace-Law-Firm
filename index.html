<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>La Grâce Law Firm | Homepage</title>
  </head>
  <body>
    <header>
      <section class="hero-section">
        <!--Topbar-->
        <div class="topbar">
          <div class="container">
            <div class="topbar-contact">
              <div class="email-icon">
                <i class="ri-mail-fill"></i>
                <p>consultant@lagracelawfirm.com</p>
              </div>

              <div class="email-icon">
                <i class="ri-phone-fill"></i>
                <p>000 0000 000</p>
              </div>
            </div>
          </div>
        </div>
        <!--Navbar-->
        <nav>
          <div class="navbar">
            <img src="img/site_logo.png" alt="La Grâce Law Firm" />
            <ul>
              <li><a href="#">Home</a></li>
              <li><a href="#">About Us</a></li>
              <li><a href="#">Practice Areas</a></li>
              <li><a href="#">Team</a></li>
              <li><a href="#">Testimonial</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
            <button class="btn btn-primary">Schedule Consultation</button>
          </div>
        </nav>
        <!--Slider-->
        <div class="slider-container">
          <div class="slider">
            <div class="slide">
              <img src="img/main_slider/slide_1.jpg" alt="slider_one" />
            </div>
            <div class="slide">
              <img src="img/main_slider/slide_2.jpg" alt="slider_two" />
            </div>
            <div class="slide">
              <img src="img/main_slider/slide_3.jpg" alt="slider_three" />
            </div>
          </div>
          <button class="prev">&#10094;</button>
          <button class="next">&#10095;</button>
        </div>
      </section>
    </header>

    <script src="js/script.js"></script>
  </body>
</html>
